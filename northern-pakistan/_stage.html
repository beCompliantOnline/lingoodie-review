<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Northern Pakistan · Sara, Larisa & Antonio · Sep 10–23</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  :root{
    --ink:#1e241d; --muted:#5f6b5c; --line:#e3e6db;
    --city:#b8860b; --city-bg:#f6edd6;
    --nature:#1f6f43; --nature-bg:#e2f0e6;
    --travel:#4f6b86; --travel-bg:#e8eef4;
    --paper:#fbfbf5; --card:#ffffff; --accent:#0f5132;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}
  header.hero{position:relative;overflow:hidden;color:#fff;text-align:center;padding:66px 20px;
    background:linear-gradient(135deg,#0c3d28 0%,#1f6f43 55%,#2b6ea0 100%)}
  .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .hero-tint{position:absolute;inset:0;z-index:1;background:linear-gradient(135deg,rgba(10,55,36,.72),rgba(20,90,58,.5) 55%,rgba(30,80,120,.6))}
  header.hero .inner{position:relative;z-index:2;max-width:860px;margin:0 auto}
  .kicker{letter-spacing:.28em;text-transform:uppercase;font-size:12px;opacity:.95;margin-bottom:14px}
  header.hero h1{margin:0;font-size:clamp(28px,6vw,44px);font-weight:800;line-height:1.1;text-shadow:0 2px 16px rgba(0,0,0,.4)}
  header.hero p{margin:14px auto 0;max-width:610px;font-size:16px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
  .badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .badge{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);padding:6px 13px;border-radius:999px;font-size:13px;backdrop-filter:blur(3px)}
  .callout{display:flex;gap:14px;margin:26px 0 8px;flex-wrap:wrap}
  .callout .col{flex:1;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .callout .col h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
  .callout .col p{margin:0;font-size:13.5px;color:var(--muted)}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .dot.city{background:var(--city)} .dot.nature{background:var(--nature)}
  .route{margin:24px 0 6px;font-size:14px;color:var(--muted);text-align:center}
  .route b{color:var(--ink)}
  #route-map{height:470px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:14px;background:#eef1ea}
  .leaflet-popup-content{font-size:13px;line-height:1.45}.leaflet-popup-content b{color:#0f5132}
  .maplegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
  .maplegend span{display:flex;align-items:center;gap:6px}
  .msw{width:13px;height:13px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:18px 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .gallery{display:flex;gap:3px;height:250px;background:#dfe3d8}
  .gallery img{flex:1;min-width:0;height:100%;object-fit:cover;display:block;background:#dfe3d8}
  .day .top{display:flex;align-items:flex-start;gap:16px;padding:18px 22px 6px}
  .daynum{flex:none;width:58px;height:58px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:800;line-height:1;color:#fff;margin-top:-48px;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);position:relative;z-index:3;text-align:center}
  .daynum small{font-size:8.5px;font-weight:700;letter-spacing:.06em;opacity:.95;margin-bottom:2px}
  .daynum .n{font-size:22px}
  .city-bar{background:var(--city)} .nature-bar{background:var(--nature)} .travel-bar{background:var(--travel)}
  .day .head{flex:1}
  .day .head h2{margin:2px 0 6px;font-size:19px}
  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:6px;margin-right:6px}
  .tag.city{background:var(--city-bg);color:#8a6608}
  .tag.nature{background:var(--nature-bg);color:var(--nature)}
  .tag.travel{background:var(--travel-bg);color:var(--travel)}
  .tag.thrill{background:#fde8e8;color:#b3261e}
  .day .body{padding:4px 22px 22px}
  .day p{margin:8px 0} .day ul{margin:8px 0;padding-left:20px} .day li{margin:5px 0}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{font-size:12.5px;background:#f2f1e6;border:1px solid var(--line);border-radius:8px;padding:6px 11px;color:var(--muted)}
  .chip b{color:var(--ink);font-weight:600}
  .hike{background:var(--nature-bg);border-left:4px solid var(--nature);border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0;font-size:13.5px}
  .hike b{color:var(--nature)}
  .wx{background:#eef3f8;border-left:4px solid #4f6b86;border-radius:0 10px 10px 0;padding:8px 12px;margin:10px 0 12px;font-size:12.5px;color:#33414f;line-height:1.5}
  .wx b{color:#2f4a63}
  .wx-live{background:#e7f5ec;border-left:4px solid #1f8a4c;border-radius:0 8px 8px 0;padding:6px 10px;margin:0 0 7px;font-size:12.5px;color:#14532d;line-height:1.5}
  .wx-live b{color:#116234}
  .wx-live .tag{display:inline-block;background:#1f8a4c;color:#fff;font-size:10px;font-weight:800;letter-spacing:.4px;padding:1px 6px;border-radius:20px;vertical-align:middle;margin-right:5px}
  .wx-live .asof{color:#4b6b57;font-weight:600}
  .thrillbox{background:#fdeceb;border-left:4px solid #b3261e;border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0;font-size:13.5px}
  .thrillbox b{color:#b3261e}
  h2.section{margin:44px 0 6px;font-size:22px;border-bottom:2px solid var(--line);padding-bottom:8px}
  .safety{background:#fff7ed;border:1px solid #f0d9b5;border-left:5px solid #c99a2e;border-radius:12px;padding:14px 20px;margin-top:14px}
  .safety h4{margin:6px 0 6px;font-size:15px;color:#9a6a00}.safety p{margin:6px 0;font-size:13.5px;color:#5c4a1e}
  .tips{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 22px;margin-top:14px}
  .tips h4{margin:16px 0 4px;font-size:15px;color:var(--accent)}.tips p{margin:4px 0 14px;font-size:14px;color:#3a443a}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
  .opcard{flex:1;min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .opcard h4{margin:0 0 6px;font-size:15px;color:var(--accent)}.opcard p{margin:0;font-size:13.5px;color:#3a443a}
  .costtable{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .costtable th,.costtable td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  .costtable th{background:#f2f1e6;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .costtable td.amt{white-space:nowrap;font-weight:700;color:#0f5132}
  .costtable tr:last-child td{border-bottom:none}
  .costtable tr.total td{background:#e6f0e9;font-weight:800;font-size:15px}
  .costnote{font-size:13px;color:var(--muted);margin-top:10px}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
  a{color:var(--accent)}
  .day.opt{border:2px dashed #d98a00;background:#fffdf7}
  .opt-badge{display:inline-block;background:#fff3e0;color:#a8660a;border:1px solid #f0c98a;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:6px;margin-left:6px;vertical-align:middle}
  .opt-inline{background:#fff3e0;color:#a8660a;border:1px solid #f0c98a;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .pre{background:#eef6f6;border:1px solid #cfe6e6;border-radius:16px;margin:18px 0;overflow:hidden}
  .pre .top{display:flex;align-items:flex-start;gap:16px;padding:18px 22px 6px}
  .pre .badge2{flex:none;min-width:96px;padding:10px 12px;border-radius:12px;background:#2b8a8a;color:#fff;text-align:center;font-weight:800;line-height:1.15;margin-top:0;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.2)}
  .pre .badge2 small{display:block;font-size:9px;letter-spacing:.06em;opacity:.9}
  .pre .body{padding:4px 22px 22px}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  @media(max-width:560px){
    .gallery{height:180px}
    header.hero{padding:46px 16px}
    .wrap{padding:0 14px 60px}
    #route-map{height:340px}
    .day .top,.pre .top{gap:12px;padding:16px 15px 6px}
    .day .body,.pre .body{padding:4px 15px 18px}
    .daynum{width:50px;height:50px;margin-top:-42px}
    .daynum .n{font-size:20px}
    .callout{gap:10px}
    .callout .col,.opcard{min-width:100%}
    .costtable th,.costtable td{padding:8px 10px;font-size:13px}
    h2.section{font-size:20px}
    .pre .badge2,.badge2{min-width:78px;font-size:13px}
  }
</style>
</head>
<body>
<p>STAGING PROBE — verifying cloud write fidelity before touching the live page.</p>
</body>
</html>
